# Parámetros del proyecto Reto 2 — Fenotipado de secuelas post-infecciosas.
# Todo número que use el código debe salir de aquí.

rutas:
  # Carpeta con los datos del reto (fuera del repositorio: los datos no se versionan)
  datos: "../SECUELAS-Challenge/DATOS COVID Y OTROS VIRUS RESPIRATORIOS/bases_reto2"
  nucleo: "cohorte_unificada_nucleo.csv"
  completa: "cohorte_unificada.csv"
  diccionario: "diccionario_variables_reto2.xlsx"
  figuras: "outputs/figuras"
  tablas: "outputs/tablas"
  procesados: "datos_procesados"      # tablas limpias (ignorado por git: datos de pacientes)

semilla: 2026

privacidad:
  n_minimo_celda: 10          # celdas con N < 10 se suprimen en tablas de salida

registros:                    # orden de presentación y columna de pertenencia
  CIBERESUCICOVID: en_CIBERESUCICOVID
  POSTCOVID_LLEIDA: en_POSTCOVID_LLEIDA
  TENACITY: en_TENACITY
  VIRGEN_DEL_ROCIO: en_VIRGEN_DEL_ROCIO

colores_registro:
  CIBERESUCICOVID: "#2a6f97"
  POSTCOVID_LLEIDA: "#c8553d"
  TENACITY: "#588b8b"
  VIRGEN_DEL_ROCIO: "#9b7bb8"

calidad:
  codigo_desconocido: 9       # 9 = "se desconoce" -> NaN
  ih_porccmd_principal: 50    # umbral de cumplimentación CIBERESUCICOVID (análisis principal)
  ih_porccmd_sensibilidad: 99
  dlco_plausible: [20, 160]   # % predicho; fuera de rango se marca, no se borra en el EDA

tiempo:
  ventana_definicion_dias: [60, 210]   # estado tras el alta usado para definir fenotipos
  ventana_comun_meses: 12              # comparación entre cohortes solo hasta aquí
  ventana_anual_dias: [270, 480]       # medida "al año" para el análisis de abandono
  cortes_meses: [0, 2, 4, 5, 8, 10, 15, 21, 30, 42, 60]   # tramos para resumir trayectorias

umbrales_clinicos:
  dlco_pct: 80        # DLCO < 80 % predicho = alterada
  fvc_pct: 80
  fev1_pct: 80
  mmrc: 2             # mMRC >= 2 = disnea relevante
  hads: 8             # HADS-A / HADS-D >= 8 = caso posible
  pm6m_metros: 400    # referencia orientativa (sin ajustar por edad/sexo)

edad_grupos:          # reagrupación de edad_tramo5 (tramos desiguales por protección de datos)
  "<50": ["15-19", "20-24", "25-29", "30-34", "35-39", "40-44", "45-49", "40-49", "<50"]
  "50-64": ["50-54", "55-59", "60-64"]
  "65-74": ["65-69", "70-74"]
  ">=75": ["75-79", "80-84", "85-89", "90+"]
  # "50-69", "60-69" y "70+" cruzan grupos: quedan como ausentes en la reagrupación

# ---------------------------------------------------------------------------
# Limpieza (notebook 02, src/limpieza.py). Cada regla está en docs/registro_decisiones.md
limpieza:
  codigos_no_disponible: [9999, 99999]   # Virgen del Rocío: "No disponible" -> NaN
  sexo_no_especificado: 2                # -> NaN
  tolerancia_duplicado_dias: 30          # misma prueba en dos registros si |Δdías| <= 30
  margen_no_le_toca_dias: 60             # TENACITY: visita aún no debida si alta + mes + margen > corte
  dias_por_mes: 30.44
  # Registro al que se asigna cada paciente compartido (un solo lado de la replicación)
  asignacion_compartidos:
    fusionada_lleida: POSTCOVID_LLEIDA   # su seguimiento procede de Lleida
    enriquecida_vrocio: VIRGEN_DEL_ROCIO

formato_fecha:                           # formato explícito por registro de origen
  CIBERESUCICOVID: "%Y-%m-%d"
  POSTCOVID_LLEIDA: "%Y-%m-%d"
  TENACITY: "%Y-%m-%d"
  VIRGEN_DEL_ROCIO: "%m/%d/%Y"

rangos_plausibles:                       # fuera de rango -> medida excluida (no borrada)
  dlco: [20, 160]
  fvc: [20, 160]
  fev1: [20, 160]
  pm6m: [100, 900]                       # < 100 m: 3 valores, probable % del predicho
  mmrc: [0, 4]
  hads_a: [0, 21]
  hads_d: [0, 21]

# Estado clínico por umbral: [clave en umbrales_clinicos, dirección de "alterado"]
estados:
  dlco: [dlco_pct, "<"]
  fvc: [fvc_pct, "<"]
  fev1: [fev1_pct, "<"]
  pm6m: [pm6m_metros, "<"]
  mmrc: [mmrc, ">="]
  hads_a: [hads, ">="]
  hads_d: [hads, ">="]

variables_definicion:
  capa_A: [dlco, fvc]                    # respiratoria, disponible en los 4 registros
  capa_B_extra: [hads_a, hads_d, mmrc, pm6m]
  solo_descripcion: [fev1, fibrosis_estricta, fibrosis_amplia, tractos_fibrosos]

# Variables de seguimiento por registro y visita: [visita, columna, columna_fecha, mes_nominal].
# columna_fecha puede ser una lista: se usa la primera fecha disponible (respaldo).
# Verificado contra la hoja «Todas las variables» del diccionario.
variables_visita:
  dlco:
    CIBERESUCICOVID:
      - [M3, M3_followup_dlco, M3_followup_spirometry_date, 3]
      - [M6, M6_followup_dlco, M6_followup_spirometry_date, 6]
      - [A1, A1_followup_dlco_3, A1_followup_spirometry_date_3, 12]
    TENACITY:
      - [M3, M3_dlco, M3_fecha_pfr, 3]
      - [M6, M6_dlco, M6_fecha_pfr, 6]
      - [A1, A1_dlco, A1_fecha_pfr, 12]
    POSTCOVID_LLEIDA:
      - [LV1, LV1_dlco_porcentage, LV1_fecha_pfr, 3]
      - [LV2, LV2_dlco_porcentage, LV2_fecha_pfr, 6]
      - [LA1, LA1_dlco_porcentage, LA1_fecha_pfr, 12]
      - [LM18, LM18_dlco_porcentage, LM18_fecha_pfr, 18]
      - [LM24, LM24_dlco_porcentage, LM24_fecha_pfr, 24]
      - [LA3, LA3_dlco_porcentage, LA3_fecha_pfr, 36]
      - [LA4, LA4_dlco_porcentage, LA4_fecha_pfr, 48]
    VIRGEN_DEL_ROCIO:
      - [V1, DLCO_porcentaje, Fecha_DLCO, 1]
      - [V2, DLCO_porc2, FECHA2VISITA, 6]
  fvc:
    CIBERESUCICOVID:
      - [M3, M3_followup_spirometry_fvc, M3_followup_spirometry_date, 3]
      - [M6, M6_followup_spirometry_fvc, M6_followup_spirometry_date, 6]
      - [A1, A1_followup_spirometry_fvc_3, A1_followup_spirometry_date_3, 12]
    TENACITY:
      - [M3, M3_fvc, M3_fecha_pfr, 3]
      - [M6, M6_fvc, M6_fecha_pfr, 6]
      - [A1, A1_fvc, A1_fecha_pfr, 12]
    POSTCOVID_LLEIDA:
      - [LV1, LV1_fvc_porcentage, LV1_fecha_pfr, 3]
      - [LV2, LV2_fvc_porcentage, LV2_fecha_pfr, 6]
      - [LA1, LA1_fvc_porcentage, LA1_fecha_pfr, 12]
      - [LM18, LM18_fvc_porcentage, LM18_fecha_pfr, 18]
      - [LM24, LM24_fvc_porcentage, LM24_fecha_pfr, 24]
      - [LA3, LA3_fvc_porcentage, LA3_fecha_pfr, 36]
      - [LA4, LA4_fvc_porcentage, LA4_fecha_pfr, 48]
    VIRGEN_DEL_ROCIO:
      - [V1, FVC_r, Fecha_espiro, 1]
      - [V2, FVC_r2, FECHA2VISITA, 6]
  fev1:
    CIBERESUCICOVID:
      - [M3, M3_followup_spirometry_fev, M3_followup_spirometry_date, 3]
      - [M6, M6_followup_spirometry_fev, M6_followup_spirometry_date, 6]
      - [A1, A1_followup_spirometry_fev_3, A1_followup_spirometry_date_3, 12]
    TENACITY:
      - [M3, M3_fev, M3_fecha_pfr, 3]
      - [M6, M6_fev, M6_fecha_pfr, 6]
      - [A1, A1_fev, A1_fecha_pfr, 12]
    POSTCOVID_LLEIDA:
      - [LV1, LV1_fev1_porcentage, LV1_fecha_pfr, 3]
      - [LV2, LV2_fev1_porcentage, LV2_fecha_pfr, 6]
      - [LA1, LA1_fev1_porcentage, LA1_fecha_pfr, 12]
      - [LM18, LM18_fev1_porcentage, LM18_fecha_pfr, 18]
      - [LM24, LM24_fev1_porcentage, LM24_fecha_pfr, 24]
      - [LA3, LA3_fev1_porcentage, LA3_fecha_pfr, 36]
      - [LA4, LA4_fev1_porcentage, LA4_fecha_pfr, 48]
    VIRGEN_DEL_ROCIO:
      - [V1, FEV_r, Fecha_espiro, 1]
      - [V2, FEV_r2, FECHA2VISITA, 6]
  pm6m:
    TENACITY:
      - [M3, M3_distancia_6mwt, [M3_fecha_visita, M3_fecha_pfr], 3]
      - [M6, M6_distancia_6mwt, [M6_fecha_visita, M6_fecha_pfr], 6]
      - [A1, A1_distancia_6mwt, [A1_fecha_visita, A1_fecha_pfr], 12]
