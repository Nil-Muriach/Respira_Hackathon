      - [LA4, LA4_distancia_6mwt, [LA4_fecha_consulta, LA4_fecha_pfr], 48]
    VIRGEN_DEL_ROCIO:
      - [V1, Metrosrecorridos, Fecha_test, 1]
  mmrc:
    TENACITY:
      - [M3, M3_disnea_mmrc, [M3_fecha_visita, M3_fecha_pfr], 3]
      - [M6, M6_disnea_mmrc, [M6_fecha_visita, M6_fecha_pfr], 6]
      - [A1, A1_disnea_mmrc, [A1_fecha_visita, A1_fecha_pfr], 12]
