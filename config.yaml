# Imagen torácica (solo descripción). Formularios de Lleida/TENACITY: [visita, bandera_completo,
# variable_lesion, columna_fecha, mes]; CIBERESUCICOVID: [visita, tac_hecho, tractos_fibrosos, fecha, mes]
imagen:
  fibrosis:
    TENACITY:
      - [M3, M3_tacimagen_complete, M3_fibetic_reticular_lesions, M3_fecha_tac, 3]
      - [M6, M6_tacimagen_complete, M6_fibetic_reticular_lesions, M6_fecha_tac, 6]
    POSTCOVID_LLEIDA:
      - [LV1, LV1_tacimagen_complete, LV1_fibetic_reticular_lesions, [LV1_fecha_consulta, LV1_fecha_pfr], 3]
      - [LV2, LV2_tacimagen_complete, LV2_fibetic_reticular_lesions, [LV2_fecha_consulta, LV2_fecha_pfr], 6]
      - [LA1, LA1_tacimagen_complete, LA1_fibetic_reticular_lesions, [LA1_fecha_consulta, LA1_fecha_pfr], 12]
      - [LM18, LM18_tacimagen_complete, LM18_fibetic_reticular_lesions, [LM18_fecha_consulta, LM18_fecha_pfr], 18]
      - [LM24, LM24_tacimagen_complete, LM24_fibetic_reticular_lesions, [LM24_fecha_consulta, LM24_fecha_pfr], 24]
      - [LA3, LA3_tacimagen_complete, LA3_fibetic_reticular_lesions, [LA3_fecha_consulta, LA3_fecha_pfr], 36]
      - [LA4, LA4_tacimagen_complete, LA4_fibetic_reticular_lesions, [LA4_fecha_consulta, LA4_fecha_pfr], 48]
  formulario_completo: 2
  codigo_fibrotica: 1
  codigo_reticular: 2
  tac_ciberes:                           # CIBERESUCICOVID: [visita, tac_hecho, prefijo_resultado, fecha, mes]
    visitas:
      - [M3, M3_tac_followup, M3_result_tac_followup, M3_date_tac_followup, 3]
      - [M6, M6_tac_followup, M6_result_tac_followup, M6_date_tac_followup, 6]
      - [A1, A1_tac_followup_2, A1_result_tac_followup_2, A1_date_tac_followup_2, 12]
    hallazgos:                           # variable -> código de la casilla (prefijo___código)
      tac_normalizado: 0
      tac_infiltrados: 1
      tac_epid: 2
      tractos_fibrosos: 3

visitas_tenacity:                        # [visita, fecha_visita, perdida_seguimiento, mes]
  - [M3, M3_fecha_visita, M3_perdida_seg, 3]
  - [M6, M6_fecha_visita, M6_perdida_seg, 6]
  - [A1, A1_fecha_visita, A1_perdida_seg, 12]

# ---------------------------------------------------------------------------
# Fenotipado (notebook 03): descubrimiento en CIBERESUCICOVID, comparación con Lleida y TENACITY
fenotipado:
  descubre: CIBERESUCICOVID
  replica: [POSTCOVID_LLEIDA, TENACITY]
  visitas:                               # visita de CIBERESUCICOVID -> tolerancia en días y visita equivalente
    M3: {ventana: [30, 150], POSTCOVID_LLEIDA: LV1, TENACITY: M3}
    M6: {ventana: [120, 270], POSTCOVID_LLEIDA: LV2, TENACITY: M6}
    A1: {ventana: [240, 480], POSTCOVID_LLEIDA: LA1, TENACITY: A1}
  horizontes:                            # acumulado: cada horizonte usa su visita y las anteriores
    H3: [M3]
    H6: [M3, M6]
    H12: [M3, M6, A1]
  dominios:                              # variables de definición (peso igual por dominio)
    funcion: [dlco, fvc]
    sintomas: [fatiga, resolucion]
  categoricas: [fatiga]                  # binaria (coincidencia); resolución 0-1-2 como ordinal
  ancla: [[dlco, fvc], [fatiga, resolucion]]   # en la última visita, uno de cada grupo (si la visita lo recoge)
  compartidas: [dlco, fvc]               # únicas comparables con Lleida y TENACITY
  rango_gower:                           # rango de normalización en Gower: P2,5–P97,5 de CIBERESUCICOVID (redondeado),
    dlco: [40, 110]                      # fijo e idéntico en todas las cohortes. Con el rango plausible (20–160) una
    fvc: [55, 125]                       # diferencia clínica de 20 puntos pesaba 0,14 frente a 1 de un síntoma distinto.
    resolucion: [0, 2]
    fatiga: [0, 1]
  rango_cambio:                          # cambio último − primero (solo numéricas continuas); P2,5–P97,5
    dlco: [-20, 30]
    fvc: [-20, 30]
  k_rango: [2, 6]
  k_comparacion: 3
  n_permutaciones: 100
  n_bootstrap: 200
  min_pacientes_centro: 50
  descripcion:                           # no definen el fenotipo; solo lo describen
    eventos: [reingreso, urgencias, compl_cardiovascular, compl_infecciosa]
    imagen: [tac_normalizado, tac_infiltrados, tac_epid, tractos_fibrosos]
    otras: [fev1]
    replica: [hads_a, hads_d, mmrc, pm6m, astenia, fatiga_muscular, fev1]
    ingreso_binarias: [nu_ingreso_uci, nu_traqueo, nu_hta, nu_diabetes, nu_epoc, nu_card_cronica, nu_renal_cronica]

# ---------------------------------------------------------------------------
# Fenotipado multidominio (notebook 04): descubrimiento en POSTCOVID-Lleida, comparación con TENACITY y
# CIBERESUCICOVID. Mismo procedimiento que el notebook 03 (src/fenotipado_perfil.py).
fenotipado_lleida:
  titulo: "POSTCOVID-Lleida"
  descubre: POSTCOVID_LLEIDA
  replica: [TENACITY, CIBERESUCICOVID]
  visitas:                               # visita genérica -> tolerancia en días y código en cada cohorte
    T3: {ventana: [30, 150], POSTCOVID_LLEIDA: LV1, TENACITY: M3, CIBERESUCICOVID: M3}
    T6: {ventana: [120, 270], POSTCOVID_LLEIDA: LV2, TENACITY: M6, CIBERESUCICOVID: M6}
    T12: {ventana: [240, 480], POSTCOVID_LLEIDA: LA1, TENACITY: A1, CIBERESUCICOVID: A1}
  horizontes:
    H3: [T3]
    H6: [T3, T6]
    H12: [T3, T6, T12]
  dominios:                              # lo que Lleida y TENACITY recogen de forma comparable
    funcion: [dlco, fvc]
    esfuerzo: [pm6m]
    disnea: [mmrc]
    animo: [hads_a, hads_d]
  categoricas: []
  ancla: [[dlco, fvc], [hads_a, hads_d, mmrc]]   # en la última visita, uno de cada grupo (si la cohorte lo recoge)
  rango_gower:                           # P2,5–P97,5 de Lleida (DLCO y FVC iguales que en el notebook 03)
    dlco: [40, 110]
    fvc: [55, 125]
    pm6m: [220, 580]
    mmrc: [0, 4]
    hads_a: [0, 14]
    hads_d: [0, 14]
  rango_cambio:                          # cambio último − primero (P2,5–P97,5 de Lleida)
    dlco: [-20, 30]
    fvc: [-20, 30]
    pm6m: [-80, 180]
    mmrc: [-2, 2]
    hads_a: [-8, 8]
    hads_d: [-8, 8]
  k_rango: [2, 6]
  k_comparacion: 3
  n_permutaciones: 100
  n_bootstrap: 200
  min_pacientes_centro: 50
  estabilidad_centros: false             # Lleida es un solo centro
  descripcion:                           # no definen el fenotipo; cada cohorte usa las que recoge
    alguna: [reingreso, urgencias, compl_cardiovascular, compl_infecciosa,
             tac_normalizado, tac_infiltrados, tac_epid, tractos_fibrosos, fibrosis_estricta, fibrosis_amplia]
    ultima: [fev1, dlco, fvc, fatiga, resolucion, astenia, fatiga_muscular, hads_a, hads_d, mmrc, pm6m]
    ingreso_binarias: [nu_ingreso_uci, nu_traqueo, nu_hta, nu_diabetes, nu_epoc, nu_card_cronica, nu_renal_cronica]
  desenlaces:                            # [nombre, variable, visitas, regla]
    - ["DLCO < 80 % a 12 m", dlco, [T12], ultima]
    - ["HADS-A ≥ 8 a 12 m", hads_a, [T12], ultima]
    - ["mMRC ≥ 2 a 12 m", mmrc, [T12], ultima]

# ---------------------------------------------------------------------------
# Fenotipado común (notebook 05): todas las cohortes juntas con las variables que comparten, como base para
# el modelo predictivo. Mismo procedimiento (src/fenotipado_perfil.py); validación dejando fuera cada cohorte.
fenotipado_comun:
  titulo: "CIBERESUCICOVID + POSTCOVID-Lleida + TENACITY"
  descubre: CIBERESUCICOVID              # solo fija la lista de columnas: las tres cohortes recogen DLCO/FVC/FEV1 en T3, T6 y T12
  cohortes: [CIBERESUCICOVID, POSTCOVID_LLEIDA, TENACITY]   # Virgen del Rocío fuera: mide al mes, sin visitas a 3-6-12 m
  replica: []
  visitas:
    T3: {ventana: [30, 150], CIBERESUCICOVID: M3, POSTCOVID_LLEIDA: LV1, TENACITY: M3}
    T6: {ventana: [120, 270], CIBERESUCICOVID: M6, POSTCOVID_LLEIDA: LV2, TENACITY: M6}
    T12: {ventana: [240, 480], CIBERESUCICOVID: A1, POSTCOVID_LLEIDA: LA1, TENACITY: A1}
  horizontes:
    H3: [T3]
    H6: [T3, T6]
    H12: [T3, T6, T12]
  dominios:                              # peso igual por dominio: FEV1 no duplica el peso de la espirometría
    difusion: [dlco]
    espirometria: [fvc, fev1]
  categoricas: []
  ancla: [[dlco, fvc, fev1]]
  rango_gower:                           # P2,5–P97,5 de las tres cohortes juntas (redondeado)
    dlco: [40, 110]
    fvc: [55, 125]
    fev1: [50, 125]
  rango_cambio:
    dlco: [-20, 30]
    fvc: [-20, 30]
    fev1: [-20, 30]
  k_rango: [2, 6]
  k_comparacion: 3
  n_permutaciones: 100
  n_bootstrap: 200
  min_pacientes_centro: 50
  estabilidad_centros: false
  descripcion:
    alguna: [reingreso, urgencias, compl_cardiovascular, compl_infecciosa,
             tac_normalizado, tac_infiltrados, tac_epid, tractos_fibrosos, fibrosis_estricta, fibrosis_amplia]
    ultima: [fatiga, resolucion, astenia, fatiga_muscular, hads_a, hads_d, mmrc, pm6m]
    ingreso_binarias: [nu_ingreso_uci, nu_traqueo, nu_hta, nu_diabetes, nu_epoc, nu_card_cronica, nu_renal_cronica]
  desenlaces:
    - ["DLCO < 80 % a 12 m", dlco, [T12], ultima]
    - ["HADS-A ≥ 8 a 12 m", hads_a, [T12], ultima]
    - ["mMRC ≥ 2 a 12 m", mmrc, [T12], ultima]
    - ["Reingreso hasta 12 m", reingreso, [T3, T6, T12], alguna]
  predictores_alta:                      # comunes a las tres cohortes (para el modelo futuro; aquí solo se preparan)
    [grupo_edad, sexo, estancia_hosp_dias, nu_ingreso_uci, nu_hta, nu_diabetes, nu_card_cronica, nu_epoc,
     nu_renal_cronica, nu_tabaquismo]
