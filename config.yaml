# Imagen torácica (solo descripción). Formularios de Lleida/TENACITY: [visita, bandera_completo,
# variable_lesion, columna_fecha, mes]; CIBERESUCICOVID: [visita, tac_hecho, tractos_fibrosos, fecha, mes]
imagen:
  fibrosis:
    TENACITY:
      - [M3, M3_tacimagen_complete, M3_fibetic_reticular_lesions, M3_fecha_tac, 3]
      - [M6, M6_tacimagen_complete, M6_fibetic_reticular_lesions, M6_fecha_tac, 6]
    POSTCOVID_LLEIDA:
      - [LV1, LV1_tacimagen_complete, LV1_fibetic_reticular_lesions, [LV1_fecha_consulta, LV1_fecha_pfr], 3]
      - [LV2, LV2_tacimagen_complete, LV2_fibetic_reticular_lesions, [LV2_fecha_consulta, LV2_fecha_pfr], 6]
      - [LA1, LA1_tacimagen_complete, LA1_fibetic_reticular_lesions, [LA1_fecha_consulta, LA1_fecha_pfr], 12]
      - [LM18, LM18_tacimagen_complete, LM18_fibetic_reticular_lesions, [LM18_fecha_consulta, LM18_fecha_pfr], 18]
      - [LM24, LM24_tacimagen_complete, LM24_fibetic_reticular_lesions, [LM24_fecha_consulta, LM24_fecha_pfr], 24]
      - [LA3, LA3_tacimagen_complete, LA3_fibetic_reticular_lesions, [LA3_fecha_consulta, LA3_fecha_pfr], 36]
      - [LA4, LA4_tacimagen_complete, LA4_fibetic_reticular_lesions, [LA4_fecha_consulta, LA4_fecha_pfr], 48]
  formulario_completo: 2
  codigo_fibrotica: 1
  codigo_reticular: 2
  tractos_fibrosos:
    CIBERESUCICOVID:
      - [M3, M3_tac_followup, M3_result_tac_followup___3, M3_date_tac_followup, 3]
      - [M6, M6_tac_followup, M6_result_tac_followup___3, M6_date_tac_followup, 6]
      - [A1, A1_tac_followup_2, A1_result_tac_followup_2___3, A1_date_tac_followup_2, 12]

visitas_tenacity:                        # [visita, fecha_visita, perdida_seguimiento, mes]
  - [M3, M3_fecha_visita, M3_perdida_seg, 3]
  - [M6, M6_fecha_visita, M6_perdida_seg, 6]
  - [A1, A1_fecha_visita, A1_perdida_seg, 12]
