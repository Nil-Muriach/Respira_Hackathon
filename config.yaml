# Imagen torácica (solo descripción). Formularios de Lleida/TENACITY: [visita, bandera_completo,
# variable_lesion, columna_fecha, mes]; CIBERESUCICOVID: [visita, tac_hecho, tractos_fibrosos, fecha, mes]
imagen:
  fibrosis:
    TENACITY:
      - [M3, M3_tacimagen_complete, M3_fibetic_reticular_lesions, M3_fecha_tac, 3]
      - [M6, M6_tacimagen_complete, M6_fibetic_reticular_lesions, M6_fecha_tac, 6]
    POSTCOVID_LLEIDA:
      - [LV1, LV1_tacimagen_complete, LV1_fibetic_reticular_lesions, [LV1_fecha_consulta, LV1_fecha_pfr], 3]
      - [LV2, LV2_tacimagen_complete, LV2_fibetic_reticular_lesions, [LV2_fecha_consulta, LV2_fecha_pfr], 6]
      - [LA1, LA1_tacimagen_complete, LA1_fibetic_reticular_lesions, [LA1_fecha_consulta, LA1_fecha_pfr], 12]
      - [LM18, LM18_tacimagen_complete, LM18_fibetic_reticular_lesions, [LM18_fecha_consulta, LM18_fecha_pfr], 18]
      - [LM24, LM24_tacimagen_complete, LM24_fibetic_reticular_lesions, [LM24_fecha_consulta, LM24_fecha_pfr], 24]
      - [LA3, LA3_tacimagen_complete, LA3_fibetic_reticular_lesions, [LA3_fecha_consulta, LA3_fecha_pfr], 36]
      - [LA4, LA4_tacimagen_complete, LA4_fibetic_reticular_lesions, [LA4_fecha_consulta, LA4_fecha_pfr], 48]
  formulario_completo: 2
  codigo_fibrotica: 1
  codigo_reticular: 2
  tac_ciberes:                           # CIBERESUCICOVID: [visita, tac_hecho, prefijo_resultado, fecha, mes]
    visitas:
      - [M3, M3_tac_followup, M3_result_tac_followup, M3_date_tac_followup, 3]
      - [M6, M6_tac_followup, M6_result_tac_followup, M6_date_tac_followup, 6]
      - [A1, A1_tac_followup_2, A1_result_tac_followup_2, A1_date_tac_followup_2, 12]
    hallazgos:                           # variable -> código de la casilla (prefijo___código)
      tac_normalizado: 0
      tac_infiltrados: 1
      tac_epid: 2
      tractos_fibrosos: 3

visitas_tenacity:                        # [visita, fecha_visita, perdida_seguimiento, mes]
  - [M3, M3_fecha_visita, M3_perdida_seg, 3]
  - [M6, M6_fecha_visita, M6_perdida_seg, 6]
  - [A1, A1_fecha_visita, A1_perdida_seg, 12]

# ---------------------------------------------------------------------------
# Fenotipado (notebook 03): descubrimiento en CIBERESUCICOVID, comparación con Lleida y TENACITY
fenotipado:
  descubre: CIBERESUCICOVID
  replica: [POSTCOVID_LLEIDA, TENACITY]
  visitas:                               # visita de CIBERESUCICOVID -> tolerancia en días y visita equivalente
    M3: {ventana: [30, 150], POSTCOVID_LLEIDA: LV1, TENACITY: M3}
    M6: {ventana: [120, 270], POSTCOVID_LLEIDA: LV2, TENACITY: M6}
    A1: {ventana: [240, 480], POSTCOVID_LLEIDA: LA1, TENACITY: A1}
  horizontes:                            # acumulado: cada horizonte usa su visita y las anteriores
    H3: [M3]
    H6: [M3, M6]
    H12: [M3, M6, A1]
  dominios:                              # variables de definición (peso igual por dominio)
    funcion: [dlco, fvc]
    sintomas: [fatiga, resolucion]
  categoricas: [fatiga]                  # binaria (coincidencia); resolución 0-1-2 como ordinal
  ancla: [[dlco, fvc], [fatiga, resolucion]]   # en la última visita, uno de cada grupo (si la visita lo recoge)
  compartidas: [dlco, fvc]               # únicas comparables con Lleida y TENACITY
  rango_gower:                           # rango de normalización en Gower: P2,5–P97,5 de CIBERESUCICOVID (redondeado),
    dlco: [40, 110]                      # fijo e idéntico en todas las cohortes. Con el rango plausible (20–160) una
    fvc: [55, 125]                       # diferencia clínica de 20 puntos pesaba 0,14 frente a 1 de un síntoma distinto.
    resolucion: [0, 2]
    fatiga: [0, 1]
  rango_cambio:                          # cambio último − primero (solo numéricas continuas); P2,5–P97,5
    dlco: [-20, 30]
    fvc: [-20, 30]
  k_rango: [2, 6]
  k_comparacion: 3
  n_permutaciones: 100
  n_bootstrap: 200
  min_pacientes_centro: 50
  descripcion:                           # no definen el fenotipo; solo lo describen
    eventos: [reingreso, urgencias, compl_cardiovascular, compl_infecciosa]
    imagen: [tac_normalizado, tac_infiltrados, tac_epid, tractos_fibrosos]
    otras: [fev1]
    replica: [hads_a, hads_d, mmrc, pm6m, astenia, fatiga_muscular, fev1]
    ingreso_binarias: [nu_ingreso_uci, nu_traqueo, nu_hta, nu_diabetes, nu_epoc, nu_card_cronica, nu_renal_cronica]

# ---------------------------------------------------------------------------
# Fenotipado común (notebook 04): todas las cohortes juntas con las variables que comparten. Es el fenotipo
# principal: lo usan las trayectorias (05) y los modelos (06–08). Mismo procedimiento (src/fenotipado_perfil.py); validación dejando fuera cada cohorte.
fenotipado_comun:
  titulo: "CIBERESUCICOVID + POSTCOVID-Lleida + TENACITY"
  descubre: CIBERESUCICOVID              # solo fija la lista de columnas: las tres cohortes recogen DLCO/FVC/FEV1 en T3, T6 y T12
  cohortes: [CIBERESUCICOVID, POSTCOVID_LLEIDA, TENACITY]   # Virgen del Rocío fuera: mide al mes, sin visitas a 3-6-12 m
  replica: []
  visitas:
    T3: {ventana: [30, 150], CIBERESUCICOVID: M3, POSTCOVID_LLEIDA: LV1, TENACITY: M3}
    T6: {ventana: [120, 270], CIBERESUCICOVID: M6, POSTCOVID_LLEIDA: LV2, TENACITY: M6}
    T12: {ventana: [240, 480], CIBERESUCICOVID: A1, POSTCOVID_LLEIDA: LA1, TENACITY: A1}
  horizontes:
    H3: [T3]
    H6: [T3, T6]
    H12: [T3, T6, T12]
  dominios:                              # peso igual por dominio: FEV1 no duplica el peso de la espirometría
    difusion: [dlco]
    espirometria: [fvc, fev1]
  categoricas: []
  ancla: [[dlco, fvc, fev1]]
  rango_gower:                           # P2,5–P97,5 de las tres cohortes juntas (redondeado)
    dlco: [40, 110]
    fvc: [55, 125]
    fev1: [50, 125]
  rango_cambio:
    dlco: [-20, 30]
    fvc: [-20, 30]
    fev1: [-20, 30]
  k_rango: [2, 6]
  k_comparacion: 3
  n_permutaciones: 100
  n_bootstrap: 200
  min_pacientes_centro: 50
  estabilidad_centros: false
  descripcion:
    alguna: [reingreso, urgencias, compl_cardiovascular, compl_infecciosa,
             tac_normalizado, tac_infiltrados, tac_epid, tractos_fibrosos, fibrosis_estricta, fibrosis_amplia]
    ultima: [fatiga, resolucion, astenia, fatiga_muscular, hads_a, hads_d, mmrc, pm6m]
    ingreso_binarias: [nu_ingreso_uci, nu_traqueo, nu_hta, nu_diabetes, nu_epoc, nu_card_cronica, nu_renal_cronica]
  desenlaces:
    - ["DLCO < 80 % a 12 m", dlco, [T12], ultima]
    - ["HADS-A ≥ 8 a 12 m", hads_a, [T12], ultima]
    - ["mMRC ≥ 2 a 12 m", mmrc, [T12], ultima]
    - ["Reingreso hasta 12 m", reingreso, [T3, T6, T12], alguna]
  predictores_alta:                      # comunes a las tres cohortes (los usan los modelos 06–08)
    [grupo_edad, sexo, estancia_hosp_dias, nu_ingreso_uci, nu_hta, nu_diabetes, nu_card_cronica, nu_epoc,
     nu_renal_cronica, nu_tabaquismo]

# ---------------------------------------------------------------------------
# Tabla de diferencias entre fenotipos (main, final de las secciones 2.1 y 2.2; src/fichas.py)
fichas:
  horizonte: H3                          # el único que pasa todas las pruebas en 2.2; en 2.1, el de mayor N
  cortes_smd: [0.2, 0.5, 0.8]            # Cohen: pequeña / moderada / grande
  etiquetas_smd: [despreciable, pequeña, moderada, grande]
  p_min: 0.001                           # p ajustadas menores se muestran como «<0.001»
  max_rasgos_retrato: 6                  # rasgos por fenotipo en el resumen (los de mayor SMD)
  retrato_min: pequeña                   # en el resumen entran los rasgos con al menos esta diferencia frente al resto
  edad_mayor: ["65-74", ">=75"]          # grupos de grupo_edad que cuentan como edad ≥ 65
  codigo_mujer: 1                        # sexo: 1 = mujer (misma convención que las fichas de 03 y 04)
  etiquetas:
    dlco: DLCO
    fvc: FVC
    fev1: FEV1
    pm6m: PM6M
    mmrc: Disnea mMRC
    hads_a: HADS-A (ansiedad)
    hads_d: HADS-D (depresión)
    fatiga: Fatiga
    resolucion: Resolución incompleta
    astenia: Astenia
    fatiga_muscular: Fatiga muscular
    reingreso: Reingreso
    urgencias: Visita a urgencias
    compl_cardiovascular: Complicación cardiovascular
    compl_infecciosa: Complicación infecciosa
    tac_normalizado: TAC normalizado
    tac_infiltrados: TAC con infiltrados
    tac_epid: TAC con patrón intersticial (EPID)
    tractos_fibrosos: TAC con tractos fibrosos
    fibrosis_estricta: TAC con lesiones fibróticas
    fibrosis_amplia: TAC con lesiones fibróticas o reticulares
    nu_ingreso_uci: Ingreso en UCI
    nu_traqueo: Traqueostomía
    nu_hta: Hipertensión
    nu_diabetes: Diabetes
    nu_epoc: EPOC
    nu_card_cronica: Cardiopatía crónica
    nu_renal_cronica: Enfermedad renal crónica

# ---------------------------------------------------------------------------
# Trayectorias (notebook 05): evolución de la DLCO según el fenotipo funcional H3 del notebook 04 (src/trayectorias.py)
trayectorias:
  fenotipos: fenotipos_comun.parquet     # en rutas.procesados (notebook 04)
  horizonte: H3                          # fenotipo a 3 meses: F1 función conservada / F2 afectación funcional
  nombres: {F1: "F1 · función conservada", F2: "F2 · afectación funcional"}
  cohortes: [CIBERESUCICOVID, POSTCOVID_LLEIDA, TENACITY]   # Virgen del Rocío fuera: mide al mes y casi sin seguimiento
  variable: dlco                         # variable principal (CLAUDE.md)
  secundaria: fvc                        # mismo análisis, como apoyo
  ventana_comun_dias: [30, 480]          # de la visita de ~3 meses a la anual (ventanas T3–T12 del notebook 05): común a las 3 cohortes
  mes_referencia: 3                      # tiempo = log(meses / 3): el intercepto es el valor a los 3 meses
  tramos_dias: [30, 150, 270, 480]       # T3, T6 y T12 sin solaparse: solo para medias observadas, N por punto y pesos IPW
  etiquetas_tramos: [T3, T6, T12]
  meses_prediccion: [3, 6, 9, 12]
  efectos_aleatorios: "~lt"              # intercepto y pendiente aleatorios por paciente (si no converge: solo intercepto)
  ipw:                                   # probabilidad de tener medida en T6 y en T12 dado lo observado a 3 meses
    covariables: [valor_T3, edad, sexo, estancia_hosp_dias]   # + fenotipo y cohorte (siempre)
    recorte_percentil: 99                # pesos estabilizados recortados en el P99
  extension_lleida:                      # más allá del año solo hay Lleida: se presenta aparte, sin extrapolar
    dias_min: 30
    meses_prediccion: [3, 6, 12, 18, 24, 36, 48]
    visitas: [LV1, LV2, LA1, LM18, LM24, LA3, LA4]
  transiciones:                          # reasignación de cada visita a los medoides H3 (mismos rangos y pesos de Gower)
    visitas: [T3, T6, T12]
    visita_extra_lleida: {T24: {ventana: [600, 900], POSTCOVID_LLEIDA: LM24}}
  criterio_sello: "La diferencia F2 − F1 predicha a 12 meses tiene un IC 95 % que excluye 0 en el modelo conjunto y en cada cohorte grande (CIBERESUCICOVID y Lleida)"

# ---------------------------------------------------------------------------
# Modelo al alta (notebook 06): EBM que predice el fenotipo funcional H3 (notebook 04) con los datos del alta
modelo_h3:
  base: base_modelo.parquet              # en rutas.procesados (generada por el notebook 04)
  diana: fenotipo_H3
  clase_positiva: F2                     # F2 = afectación funcional; F1 = función conservada
  predictores:
    continuas: [edad, estancia_hosp_dias]          # edad = punto medio del tramo de edad
    binarias: [sexo, nu_ingreso_uci, nu_hta, nu_diabetes, nu_card_cronica, nu_epoc, nu_renal_cronica]
    categoricas: [nu_tabaquismo]                    # 0 nunca, 1 activo, 2 exfumador
  test_size: 0.2                         # partición 80/20 estratificada por diana y cohorte
  ebm:                                   # ExplainableBoostingClassifier (interpret)
    interactions: 5
    outer_bags: 14
    learning_rate: 0.01
    max_rounds: 5000
  n_bootstrap_ic: 1000                   # IC 95 % de las métricas en test
  n_bins_calibracion: 8

# ---------------------------------------------------------------------------
# Predictores de CIBERESUCICOVID (alta + fase aguda) que usa el modelo con fase aguda (notebook 07)
modelo_ciberes:
  predictores_alta:                      # los mismos 10 del modelo al alta (notebook 06)
    continuas: [edad, estancia_hosp_dias]
    binarias: [sexo, nu_ingreso_uci, nu_hta, nu_diabetes, nu_card_cronica, nu_epoc, nu_renal_cronica]
    categoricas: [nu_tabaquismo]
  predictores_agudos:                    # tabla completa de CIBERESUCICOVID; código 2 = "se desconoce" -> NaN
    binarias:                            # durante el ingreso (AH_ = formulario de alta hospitalaria)
      AH_invasive_proccur: "Ventilación mecánica invasiva"
      AH_noninvasive_proccur: "Ventilación no invasiva"
      AH_pronevent_prtrt: "Prono"
      AH_extracorp_prdur: "ECMO"
      AH_corticost_cmyn: "Corticoides"
      AH_inotrop_cmtrt: "Vasopresores/inotropos"
    continuas:                           # [etiqueta, mínimo plausible, máximo plausible]; fuera de rango -> NaN
      AH_hodur: ["Días en UCI", 0, 200]
      AH_invasive_prdur: ["Días de VMI", 0, 200]
      IU_APACHE: ["APACHE II (ingreso UCI)", 0, 71]
      IU_SOFA: ["SOFA (ingreso UCI)", 0, 24]
      IU_PAFI: ["PaO2/FiO2 (ingreso UCI)", 30, 600]
      IU_lymphocyte: ["Linfocitos (×10³/µL)", 0, 10]
      IU_ddimer_log: ["Dímero D (log10)", 1, 6]
      IU_ldh: ["LDH (U/L)", 50, 5000]
      IU_ferritin_log: ["Ferritina (log10)", 0.5, 5.5]
      IU_creatinine: ["Creatinina (mg/dL)", 0.1, 15]
      IU_crp: ["PCR (mg/L)", 0, 600]
      IU_procalcitonin: ["Procalcitonina (ng/mL)", 0, 200]
      IU_platelet: ["Plaquetas (×10³/µL)", 10, 1000]
      IU_wbc: ["Leucocitos (×10³/µL)", 0.1, 100]
  codigo_desconocido_agudo: 2

# ---------------------------------------------------------------------------
# Modelo con fase aguda (notebook 07): solo CIBERESUCICOVID, predictores de modelo_ciberes, dianas funcionales
modelo_ciberes_funcional:
  base: base_modelo.parquet              # notebook 04: fenotipo_H3 y y_dlco
  dianas:                                # [clave, columna, clase positiva, descripción]
    - [fenotipo_h3, fenotipo_H3, F2, "Fenotipo funcional a 3 meses: afectación funcional (F2) frente a función conservada (F1)"]
    - [dlco_12m, y_dlco, 1, "DLCO < 80 % del predicho a 12 meses"]
  funcion_3m: [dlco, fvc, fev1]          # solo como predictor extra de la diana DLCO 12 m (variante «+ función a 3 m»)
  test_size: 0.2
  ebm: {interactions: 5, outer_bags: 14, learning_rate: 0.01, max_rounds: 5000}
  pliegues_centro: 5
  n_bootstrap_ic: 1000
  n_bins_calibracion: 8

# ---------------------------------------------------------------------------
# Modelo de la primera visita (notebook 08): entre los pacientes con DLCO < 80 % a 3 meses, ¿quién sigue alterado al año?
primera_visita:
  bandas_dlco: [0, 60, 70, 80]          # tramos de DLCO a 3 m (% predicho) entre los alterados
  arbol_profundidad: 3                  # CLAUDE.md: árbol de profundidad ≤ 3
  arbol_min_hoja: 20                    # hojas de ≥ 20 pacientes (estables y por encima de N_MIN)
  l1_Cs: 20                             # rejilla de regularización de la logística L1
  pliegues_internos: 5                  # validación cruzada interna (solo en las cohortes de entrenamiento)
  n_bootstrap: 1000                     # IC 95 % de AUC y ΔAUC
  n_bins_calibracion: 5
  umbrales_dca: [0.20, 0.90, 0.01]      # umbrales de probabilidad para la curva de decisión
  dca_margen_minimo: 0.01               # ventaja mínima de beneficio neto que se considera útil (1 de cada 100)
  ventana_anual_estricta: [300, 420]    # sensibilidad: visita anual entre 10 y 14 meses
